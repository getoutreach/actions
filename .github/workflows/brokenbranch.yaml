# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
name: brokenbranch
on:
  workflow_call:
    secrets:
      OUTREACH_DOCKER_JSON:
        required: false
      PAT_OUTREACH_CI:
        required: false
      SLACK_TOKEN:
        required: true

      # These secrets are only required if dm_committer is set to true.
      #
      # These all come from a GitHub app for an organization. The app
      # needs administrative read permissions. A PAT generated for the
      # app will not work - you have to use private key authorization
      # through HTTP transport for some reason. Super annoying.
      GH_APP_ID:
        required: false
      GH_APP_INSTALLATION_ID:
        required: false
      GH_APP_PRIVATE_KEY_BASE64:
        required: false
    inputs:
      image_tag:
        type: string
        description: "Release to run the action from: latest, or a version such as 1.2.3"
        default: latest
        required: false
      branch:
        type: string
        default: main
        required: false
      ignored_checks: # This should be a comma separated list of check names to ignore, verbatim.
        type: string
        default: ""
        required: false
      slack_channel:
        type: string
        required: true

      # If this is set to true the GH_APP_* secrets need to also be set.
      dm_committer:
        type: boolean
        default: false
        required: false

jobs:
  run:
    # ubuntu-slim has no Docker daemon, so run the release binary instead
    # of the action's image.
    runs-on: ubuntu-slim
    steps:
      - name: Download action
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          tag=()
          if [[ $IMAGE_TAG != latest ]]; then
            tag=("v${IMAGE_TAG#v}")
          fi
          gh release download "${tag[@]}" --repo getoutreach/actions \
            --pattern 'actions_*_linux_amd64.tar.gz' --pattern checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf actions_*_linux_amd64.tar.gz brokenbranch
      - name: Run action
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT_OUTREACH_CI: ${{ secrets.PAT_OUTREACH_CI }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          GITHUB_BRANCH: ${{ inputs.branch }}
          IGNORED_CHECKS: ${{ inputs.ignored_checks }}
          SLACK_CHANNEL: ${{ inputs.slack_channel }}
          DM_COMMITTER: ${{ inputs.dm_committer }}
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
          GH_APP_PRIVATE_KEY_BASE64: ${{ secrets.GH_APP_PRIVATE_KEY_BASE64 }}
        run: ./brokenbranch
