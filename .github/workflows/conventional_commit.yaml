# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
name: contentional_commit
on:
  workflow_call:
    secrets:
      OUTREACH_DOCKER_JSON:
        required: false
      PAT_OUTREACH_CI:
        required: false
    inputs:
      image_tag:
        type: string
        description: "Release to run the action from: latest, or a version such as 1.2.3"
        default: latest
        required: false
      bypass_author_emails:
        type: string
        description: "Space separated list of emails to bypass the conventional commit check"
        required: false

jobs:
  run:
    # ubuntu-slim has no Docker daemon, so run the release binary instead
    # of the action's image.
    runs-on: ubuntu-slim
    steps:
      - name: Download action
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          tag=()
          if [[ $IMAGE_TAG != latest ]]; then
            tag=("v${IMAGE_TAG#v}")
          fi
          gh release download "${tag[@]}" --repo getoutreach/actions \
            --pattern 'actions_*_linux_amd64.tar.gz' --pattern checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf actions_*_linux_amd64.tar.gz conventional_commit
      - name: Run action
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT_OUTREACH_CI: ${{ secrets.PAT_OUTREACH_CI }}
          BYPASS_AUTHOR_EMAILS: ${{ inputs.bypass_author_emails }}
        run: ./conventional_commit
